<body><div id="app"></div>
<script>
const D={patient:{name:'Alya Pratama',id:'MJ-2026-0042',age:29,sex:'Perempuan'},items:['Dalam dua minggu terakhir, seberapa sering Anda merasa sulit menikmati aktivitas yang biasanya Anda sukai?','Dalam dua minggu terakhir, seberapa sering Anda merasa khawatir berlebihan?','Dalam dua minggu terakhir, seberapa sering tidur Anda terganggu oleh pikiran atau perasaan?','Dalam dua minggu terakhir, seberapa sering Anda merasa mampu mengendalikan respons emosi?']};
let state={screen:'home',step:0};
const app=()=>document.getElementById('app');
function go(x){state.screen=x;render()}function login(){go('dashboard')}function start(){go('patient')}function home(){return `<div class="home"><nav><div class="brand"><div class="mark">MJ</div><div><h1>DOKTER JOHN MANTAPJIWA</h1><p>Clinical Psychological Assessment</p></div></div><div class="nav-actions"><button class="btn ghost" onclick="go('login')">Masuk klinisi</button><button class="btn accent" onclick="start()">Mulai assessment</button></div></nav><section class="hero"><div><span class="kicker">✦ Platform kesehatan mental profesional</span><h2>Memahami pikiran.<br><span>Mengenali emosi.</span><br>Menemukan keseimbangan.</h2><p>MANTAPJIWA adalah platform assessment kesehatan mental yang terstruktur, informatif, dan dirancang untuk mendukung percakapan klinis yang lebih bermakna.</p><div class="hero-actions"><button class="btn primary" onclick="go('login')">Masuk Workspace Klinisi →</button><button class="btn ghost" onclick="start()">Mulai Assessment</button></div><div class="trust"><div><b>Terstruktur</b>Alur jelas</div><div><b>Human-centered</b>Bahasa nyaman</div><div><b>Data dummy</b>Mode prototype</div></div></div><div class="visual"><div class="orb"></div><div class="panel"><div class="panel-head"><div><span class="eyebrow">Clinical overview</span><h3 style="margin:5px 0">Mental wellness snapshot</h3></div><span class="pill">Demo</span></div><div class="mini-grid"><div class="mini"><small>Mood</small><strong>62</strong><span class="pill">Stable</span></div><div class="mini"><small>Anxiety</small><strong>74</strong><span class="pill">Review</span></div><div class="mini"><small>Sleep</small><strong>45</strong><span class="pill">Tracked</span></div><div class="mini"><small>Progress</small><strong>68%</strong><span class="pill">Active</span></div></div></div></div></section><section class="home-section"><div class="section-head"><span class="eyebrow">Layanan pemeriksaan psikologis</span><h3>Memahami kondisi mental dengan lebih terarah</h3><p>Prototype demonstrasi untuk alur assessment, edukasi, dan review klinisi.</p></div><div class="services"><div class="service"><div class="icon">◌</div><h4>Mental Health Assessment</h4><p>Assessment terstruktur untuk memetakan pengalaman dan area diskusi bersama klinisi.</p></div><div class="service"><div class="icon">☼</div><h4>Mood & Anxiety Screening</h4><p>Pemeriksaan awal untuk mengenali pola mood, kekhawatiran, dan respons emosi.</p></div><div class="service"><div class="icon">◒</div><h4>Burnout Screening</h4><p>Eksplorasi kelelahan mental, tekanan, dan keseimbangan aktivitas sehari-hari.</p></div></div></section><section class="home-section alt"><div class="inner"><div class="about"><div class="about-mark">DJ</div><div><span class="eyebrow">Tentang profesional</span><h3>DOKTER JOHN MANTAPJIWA</h3><p><b style="color:#fff">dr. Muhammad John A, Sp.KJ</b> menghadirkan edukasi dan pendekatan profesional tentang kesehatan mental, psikologi, neuroscience, emosi, hubungan, dan kehidupan.</p><span class="pill">Clinical workspace · Prototype</span></div></div></div></section><section class="home-section"><div class="yt"><div><label>YOUTUBE</label><h3>DOKTER JOHN MANTAPJIWA</h3><p>Edukasi kesehatan mental, psikologi, neuroscience, emosi, hubungan, dan kehidupan.</p></div><a class="btn primary" href="https://www.youtube.com/results?search_query=Dokter+John+Mantapjiwa" target="_blank" rel="noopener">TONTON DI YOUTUBE ↗</a></div></section><footer><div><b style="color:#fff">DOKTER JOHN MANTAPJIWA</b><br>Clinical Psychological Assessment Prototype</div><div>Data dummy · Tidak terhubung ke database produksi</div></footer></div>`}
function shell(c){return `<div class="shell"><aside class="side"><div class="brand"><div class="mark">MJ</div><div><h1 style="color:#fff">DOKTER JOHN</h1><p>MANTAPJIWA · Clinical</p></div></div><nav class="nav"><button class="active" onclick="go('dashboard')">▦ <span>Dashboard</span></button><button onclick="go('patients')">♙ <span>Pasien</span></button><button onclick="go('results')">▤ <span>Hasil</span></button></nav><div class="side-foot">Mode prototype<br><b>Data dummy aktif</b></div></aside><main class="main"><header class="top"><span class="eyebrow">Workspace Klinisi</span><div class="user"><div><b>dr. Muhammad John A, Sp.KJ</b><br><span style="color:var(--muted)">Klinisi</span></div><div class="avatar">J</div><button class="btn ghost" onclick="go('home')">Publik</button></div></header>${c}</main></div>`}
function dashboard(){return shell(`<div class="content"><div class="dashboard-hero"><div><span class="eyebrow">Selamat datang kembali</span><h2>Workspace klinisi yang lebih terarah.</h2><p>Pantau pasien, assessment, dan hasil terbaru.</p></div><button class="btn accent" onclick="go('new')">＋ Buat sesi baru</button></div><div class="title"><div><h2>Dashboard</h2><p>Ringkasan aktivitas assessment hari ini.</p></div></div><div class="grid stats"><div class="card"><div class="stat-label">Total pasien</div><div class="stat-value">128</div><div class="stat-foot">↑ 12% bulan ini</div></div><div class="card"><div class="stat-label">Assessment aktif</div><div class="stat-value">14</div><div class="stat-foot">4 perlu review</div></div><div class="card"><div class="stat-label">Assessment selesai</div><div class="stat-value">96</div><div class="stat-foot">↑ 8% minggu ini</div></div><div class="card"><div class="stat-label">Menunggu review</div><div class="stat-value">7</div><div class="stat-foot" style="color:var(--warn)">Prioritas hari ini</div></div></div><div class="grid two" style="margin-top:18px"><div class="card"><div class="section-title"><h3>Aktivitas assessment</h3><span class="pill">7 hari</span></div><div class="chart">${[42,66,54,80,63,38,72].map((x,i)=>`<div class="col"><div class="bar" style="height:${x}%"></div><small>${['Sen','Sel','Rab','Kam','Jum','Sab','Min'][i]}</small></div>`).join('')}</div></div><div class="card"><div class="section-title"><h3>Quick actions</h3></div><div class="grid"><button class="choice" onclick="go('new')"><div><h4>Tambah pasien</h4><p>Buat sesi assessment baru.</p></div><b>→</b></button><button class="choice" onclick="go('patients')"><div><h4>Kelola pasien</h4><p>Lihat profil dan riwayat.</p></div><b>→</b></button><button class="choice" onclick="go('results')"><div><h4>Tinjau hasil</h4><p>Periksa laporan yang masuk.</p></div><b>→</b></button></div></div></div><div class="card" style="margin-top:18px"><div class="section-title"><h3>Pasien terbaru</h3><button class="btn ghost" onclick="go('patients')">Semua pasien</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Pasien</th><th>Assessment</th><th>Status</th><th></th></tr></thead><tbody><tr><td><b>Alya Pratama</b><br><span style="color:var(--muted)">MJ-2026-0042</span></td><td>Mood & Anxiety Check-In</td><td><span class="pill">Belum dimulai</span></td><td><button class="btn ghost" onclick="start()">Buka</button></td></tr><tr><td><b>Rizky Mahendra</b><br><span style="color:var(--muted)">MJ-2026-0039</span></td><td>Stress Profile</td><td><span class="pill">Selesai</span></td><td><button class="btn ghost" onclick="go('results')">Hasil</button></td></tr></tbody></table></div></div></div>`)}
function loginPage(){return `<div class="login"><div class="login-card"><div class="brand"><div class="mark">MJ</div><div><h1>DOKTER JOHN MANTAPJIWA</h1><p>Clinical Assessment Platform</p></div></div><h2>Masuk ke workspace klinisi</h2><p style="color:var(--muted)">Prototype demonstrasi dengan data dummy.</p><div class="field"><label>Email klinisi</label><input value="clinician@mantapjiwa.demo"></div><div class="field"><label>Password</label><input type="password" value="dummy-password"></div><button class="btn primary" style="width:100%" onclick="login()">Masuk ke prototype →</button><p style="color:var(--muted);font-size:12px">Tidak terhubung ke database produksi.</p></div></div>`}
function newPage(){return shell(`<div class="content"><div class="title"><div><h2>Tambah pasien & assessment</h2><p>Data dummy untuk demonstrasi.</p></div></div><div class="grid two"><div class="card"><div class="field"><label>Nama lengkap</label><input value="Alya Pratama"></div><div class="field"><label>Patient ID</label><input value="MJ-2026-0042" disabled></div><button class="btn primary" onclick="go('choose')">Lanjut pilih assessment →</button></div><div class="card"><h3>Clinical safety</h3><p style="color:var(--muted)">Belum ada instrumen berlisensi, scoring klinis, atau data pasien nyata yang diaktifkan.</p><span class="pill">MENUNGGU VERIFIKASI</span></div></div></div>`)}
function choose(){return shell(`<div class="content"><div class="title"><div><h2>Pilih assessment</h2><p>Pilih instrumen dummy untuk membuat sesi.</p></div></div><div class="card"><div class="choice"><div><h4>Mood & Anxiety Check-In</h4><p>4 pertanyaan dummy · estimasi 3 menit · mode trial</p></div><span class="pill">Dipilih</span></div><button class="btn primary" style="margin-top:20px" onclick="start()">Buat sesi pasien</button></div></div>`)}
function patient(){let q=D.items[state.step],last=state.step===D.items.length-1;return `<div class="screen"><div class="top"><div class="brand"><div class="mark">MJ</div><div><h1>MANTAPJIWA</h1><p>Patient Assessment</p></div></div><span class="pill">Sesi dummy · MJ-DEMO-7K2P</span></div><div class="content"><div class="assessment"><div class="card"><div class="assessment-head"><div><span class="eyebrow">Mood & Anxiety Check-In</span><h2>Halo, Alya</h2><p style="color:var(--muted)">Jawab sesuai pengalaman dua minggu terakhir.</p></div><b>${state.step+1}/${D.items.length}</b></div><div class="progress"><span style="width:${Math.max(6,state.step/D.items.length*100)}%"></span></div><div class="question">${q}</div><div class="answers">${['Tidak pernah','Beberapa hari','Lebih dari separuh hari','Hampir setiap hari'].map(x=>`<label class="answer"><input type="radio" name="a">${x}</label>`).join('')}</div><div style="display:flex;justify-content:space-between;margin-top:26px"><button class="btn ghost" onclick="${state.step?'state.step--;render()':'go(\'home\')'}">← Kembali</button><button class="btn primary" onclick="${last?'go(\'results\')':'state.step++;render()'}">${last?'Kirim jawaban':'Simpan & lanjut'}</button></div></div><div class="card" style="margin-top:14px"><b>Privasi dan persetujuan</b><p style="color:var(--muted);font-size:13px">Prototype dengan data dummy. Jangan memasukkan data pasien nyata.</p></div></div></div></div>`}
function results(){return shell(`<div class="content"><div class="title"><div><h2>Hasil assessment</h2><p>Review klinisi · data dummy.</p></div><button class="btn accent" onclick="go('report')">Preview laporan PDF</button></div><div class="grid two"><div class="card"><div class="section-title"><h3>Alya Pratama</h3><span class="pill">Terkirim</span></div><p style="color:var(--muted)">MJ-2026-0042 · 29 tahun · Perempuan</p><div class="result" style="margin-top:22px"><div class="ring"><b>68</b></div><div><h3 style="margin:0">Ringkasan dummy</h3><p style="color:var(--muted)">Perlu ditinjau bersama konteks wawancara klinis.</p></div></div><div class="report-section"><h3>Subskala</h3>${[['Mood',62],['Anxiety',74],['Sleep',45]].map(x=>`<div class="bar-row"><span>${x[0]}</span><div class="mini-bar"><span style="width:${x[1]}%"></span></div><b>${x[1]}</b></div>`).join('')}</div></div><div class="card"><h3>Catatan klinisi</h3><textarea rows="8" style="width:100%;border:1px solid var(--line);border-radius:12px;padding:12px" placeholder="Tambahkan catatan..."></textarea><button class="btn primary" style="margin-top:14px" onclick="go('report')">Buka laporan</button></div></div></div>`)}
function report(){return shell(`<div class="content"><div class="title"><div><h2>Preview laporan</h2><p>Format laporan klinisi · data dummy.</p></div><button class="btn primary" onclick="window.print()">Cetak / Simpan PDF</button></div><article class="paper"><div class="brand"><div class="mark">MJ</div><div><h1>DOKTER JOHN MANTAPJIWA</h1><p>Clinical Psychological Assessment</p></div></div><div style="margin-top:34px"><span class="eyebrow">Laporan assessment dummy</span><h2>Mood & Anxiety Check-In</h2></div><div class="meta"><div><small>Pasien</small><b>Alya Pratama</b></div><div><small>Patient ID</small><b>MJ-2026-0042</b></div><div><small>Tanggal</small><b>24 November 2026</b></div><div><small>Klinisi</small><b>dr. Muhammad John A, Sp.KJ</b></div></div><div class="report-section"><h3>Ringkasan hasil</h3><p>Skor dummy: <b>68/100</b>. Tidak untuk keputusan klinis.</p></div><div class="report-section"><h3>Interpretasi klinisi</h3><p style="color:var(--muted)">Area ini disediakan untuk review profesional.</p></div><div class="report-section"><h3>Catatan penggunaan</h3><p style="color:var(--muted)">Prototype memakai data dummy dan tidak menggantikan evaluasi klinis.</p></div></article></div>`)}
function patients(){return shell(`<div class="content"><div class="title"><div><h2>Pasien</h2><p>Data dummy untuk pengujian.</p></div><button class="btn accent" onclick="go('new')">＋ Tambah pasien</button></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Patient ID</th><th>Nama</th><th>Assessment</th><th>Status</th></tr></thead><tbody><tr><td>MJ-2026-0042</td><td>Alya Pratama</td><td>Mood & Anxiety Check-In</td><td><span class="pill">Sesi aktif</span></td></tr><tr><td>MJ-2026-0039</td><td>Rizky Mahendra</td><td>Stress Profile</td><td><span class="pill">Selesai</span></td></tr></tbody></table></div></div></div>`)}
function render(){let x=state.screen;app().innerHTML=x==='home'?home():x==='login'?loginPage():x==='dashboard'?dashboard():x==='new'?newPage():x==='choose'?choose():x==='patient'?patient():x==='results'?results():x==='report'?report():patients()}render();
</script></body></html>
